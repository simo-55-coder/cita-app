  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-violet-500 selection:text-white" style="background-color: #6a37cb;">
    <style>
      #pwa-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: linear-gradient(180deg, #703ED1 0%, #6635C6 50%, #582BAE 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        padding: env(safe-area-inset-top, 0px) 1rem env(safe-area-inset-bottom, 0px) 1rem;
        transition: opacity 0.4s ease-out;
        user-select: none;
      }
      .pwa-splash-card {
        width: 104px;
        height: 104px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow: 0 20px 40px -10px rgba(45, 14, 95, 0.5);
        padding: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pwaPulse 2.4s ease-in-out infinite;
      }
      .pwa-splash-inner {
        width: 100%;
        height: 100%;
        border-radius: 16px;
        background: linear-gradient(135deg, #8B5CF6 0%, #4F46E5 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.35);
      }
      .pwa-splash-inner svg {
        width: 42px;
        height: 42px;
        stroke: #ffffff;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
      }
      #pwa-splash h1 {
        color: #ffffff;
        font-size: 1.75rem;
        font-weight: 800;
        margin-top: 1.25rem;
        letter-spacing: -0.02em;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      }
      #pwa-splash p {
        color: rgba(221, 214, 254, 0.9);
        font-size: 0.8125rem;
        font-weight: 500;
        margin-top: 0.25rem;
        letter-spacing: 0.02em;
      }
      .pwa-dots {
        display: flex;
        gap: 6px;
        margin-top: 2rem;
      }
      .pwa-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.85);
        animation: pwaDotBounce 1.4s ease-in-out infinite;
      }
      .pwa-dot:nth-child(2) { animation-delay: 0.2s; }
      .pwa-dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes pwaPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      @keyframes pwaDotBounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
        40% { transform: translateY(-6px); opacity: 1; }
      }
    </style>
    <div id="pwa-splash">
      <div class="pwa-splash-card">
        <div class="pwa-splash-inner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 7.5c-1-1.5-3-2.5-5.5-2.5-3.5 0-6.5 3-6.5 6.5s3 6.5 6.5 6.5c2.5 0 4.5-1 5.5-2.5" />
            <path d="M11 7l4.5 8.5L20 7" />
          </svg>
        </div>
      </div>
      <h1>CVita</h1>
      <p>منشئ السيرة الذاتية PDF</p>
      <div class="pwa-dots">
        <div class="pwa-dot"></div>
        <div class="pwa-dot"></div>
        <div class="pwa-dot"></div>
      </div>
    </div>

    <div id="root"></div>
  
    <script>
      window.addEventListener('load', () => {
        const splash = document.getElementById('pwa-splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => {
            if (splash.parentNode) splash.remove();
          }, 450);
        }
      });
    </script>
  </body>
